name: travel-copilot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-build: &api-build
  context: ..
  dockerfile: deploy/api.Dockerfile

x-database: &database
  DB_HOST: db
  DB_NAME: travel_copilot

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel_owner
      POSTGRES_DB: travel_copilot
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Generate deploy/.env.production first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U travel_owner -d travel_copilot"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  migrate:
    image: travel-copilot-api:${APP_VERSION:-local}
    build: *api-build
    command: [bootstrap]
    environment:
      <<: *database
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?Required}
      DB_READER_PASSWORD: ${DB_READER_PASSWORD:?Required}
      DB_INTAKE_PASSWORD: ${DB_INTAKE_PASSWORD:?Required}
      DB_OPS_PASSWORD: ${DB_OPS_PASSWORD:?Configure operations first}
      DB_NOTIFICATION_PASSWORD: ${DB_NOTIFICATION_PASSWORD:?Configure operations first}
    networks: [data]
    depends_on:
      db: {condition: service_healthy}
    logging: *logging

  api:
    image: travel-copilot-api:${APP_VERSION:-local}
    build: *api-build
    restart: unless-stopped
    environment:
      <<: *database
      API_KEY: ${API_KEY:?Required}
      DB_READER_PASSWORD: ${DB_READER_PASSWORD:?Required}
      DB_INTAKE_PASSWORD: ${DB_INTAKE_PASSWORD:?Required}
      DB_OPS_PASSWORD: ${DB_OPS_PASSWORD:?Required}
      OPS_BACKEND_KEY: ${OPS_BACKEND_KEY:?Required}
    networks: [application, data]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, deploy.runtime, check]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

  frontend:
    image: travel-copilot-frontend:${APP_VERSION:-local}
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://api:8000
      BACKEND_API_KEY: ${API_KEY:?Required}
      SITE_ADDRESS: ${SITE_ADDRESS:?Required}
      SITE_ORIGIN: ${SITE_ORIGIN:?Required}
      OPS_USERNAME: ${OPS_USERNAME:-}
      OPS_PASSWORD_HASH: ${OPS_PASSWORD_HASH:-}
      OPS_SESSION_KEY: ${OPS_SESSION_KEY:-}
      OPS_BACKEND_KEY: ${OPS_BACKEND_KEY:?Required}
    networks: [edge, application]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/products?city=%E4%B8%8A%E6%B5%B7').then(async r=>process.exit(r.ok&&(await r.json()).products?.length?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      frontend: {condition: service_healthy}
    logging: *logging

  notifications:
    image: travel-copilot-api:${APP_VERSION:-local}
    build: *api-build
    profiles: [notifications]
    restart: unless-stopped
    command: [notify]
    environment:
      <<: *database
      DB_NOTIFICATION_PASSWORD: ${DB_NOTIFICATION_PASSWORD:?Required}
      FEISHU_NOTIFICATIONS_ENABLED: ${FEISHU_NOTIFICATIONS_ENABLED:-0}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_SIGNING_SECRET: ${FEISHU_SIGNING_SECRET:-}
      OPS_SITE_ORIGIN: ${SITE_ORIGIN:?Required}
    networks: [data, notifications_egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
    logging: *logging

  maintenance:
    image: travel-copilot-api:${APP_VERSION:-local}
    build: *api-build
    profiles: [tools]
    command: [maintain, enquiries]
    environment:
      <<: *database
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?Required}
    networks: [data]
    depends_on:
      db: {condition: service_healthy}
    logging: *logging

networks:
  edge:
  notifications_egress:
  application:
    internal: true
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
